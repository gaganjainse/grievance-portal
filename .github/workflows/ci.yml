name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: PHP lint (syntax check every file)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli composer
          find . -name "*.php" -not -path "./vendor/*" -not -path "./node_modules/*" \
            -print0 | xargs -0 -n1 php -l

      - name: Laravel runtime dirs (bootstrap/cache for package:discover)
        run: |
          mkdir -p bootstrap/cache storage/framework/sessions storage/framework/views storage/framework/cache
          chmod -R 777 bootstrap/cache storage/framework

      - name: Composer install (deps resolve check)
        run: composer install --no-interaction --prefer-dist --no-progress
